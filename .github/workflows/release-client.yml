name: Release client

# Publishes @flaresend/types and @flaresend/client to npm on its own.
# Runs on every push to main that changes either package. The version is
# worked out from conventional commits by scripts/release-client.mjs:
# fix/perf -> patch, feat -> minor, breaking -> major (minor on 0.x),
# anything else -> no release.
# Auth is npm trusted publishing (OIDC), so no npm token is stored here.

on:
  push:
    branches: [main]
    paths:
      - "packages/types/**"
      - "packages/client/**"
  workflow_dispatch:

concurrency:
  group: release-client
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit, tag and GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs full history and tags
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Do not set registry-url. setup-node then writes an auth token
          # placeholder that prevents npm from using trusted publishing.
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10.
      - run: npm install -g npm@11.20.0

      - name: Work out next version
        id: next
        run: node scripts/release-client.mjs

      - if: steps.next.outputs.version != ''
        run: pnpm install --frozen-lockfile
      - if: steps.next.outputs.version != ''
        run: pnpm audit --audit-level moderate
      - if: steps.next.outputs.version != ''
        run: pnpm --filter @flaresend/types --filter @flaresend/client build
      - if: steps.next.outputs.version != ''
        run: pnpm --filter @flaresend/types --filter @flaresend/client typecheck
      - if: steps.next.outputs.version != ''
        run: pnpm --filter @flaresend/types --filter @flaresend/client test

      # pnpm pack swaps "workspace:*" for the real version; npm publish then
      # uploads the tarball using the OIDC token. types goes first because
      # client depends on it.
      - name: Publish to npm
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          for pkg in types client; do
            name="@flaresend/$pkg"
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is already on npm, skipping"
              continue
            fi
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
            npm publish "$RUNNER_TEMP/pack/flaresend-$pkg-$VERSION.tgz" --access public --provenance --loglevel=verbose
          done

      # npm can accept an upload before its tarball is available for installs.
      - name: Verify npm packages are installable
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          for pkg in types client; do
            name="@flaresend/$pkg"
            for attempt in $(seq 1 60); do
              if npm pack "$name@$VERSION" --pack-destination "$RUNNER_TEMP/verify" --ignore-scripts --prefer-online --silent >/dev/null 2>&1; then
                echo "Verified download of $name@$VERSION"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for $name@$VERSION to become installable" >&2
                exit 1
              fi
              sleep 10
            done
          done

      # Publish before the version commit and tag. A failed publish leaves the
      # release ready for a workflow_dispatch retry without a new commit.
      # The push uses GITHUB_TOKEN, so it does not trigger another workflow.
      - name: Commit version and tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.next.outputs.bumped }}" = "true" ]; then
            git commit -am "chore(release): @flaresend/client v$VERSION"
            git tag "client-v$VERSION"
            git push --atomic origin HEAD:main "client-v$VERSION"
          elif ! git rev-parse -q --verify "refs/tags/client-v$VERSION" >/dev/null; then
            git tag "client-v$VERSION"
            git push origin "client-v$VERSION"
          fi

      - name: Create GitHub release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if gh release view "client-v$VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release edit "client-v$VERSION" --draft=false
          elif ! gh release view "client-v$VERSION" >/dev/null 2>&1; then
            gh release create "client-v$VERSION" --generate-notes --title "@flaresend/client $VERSION"
          fi
