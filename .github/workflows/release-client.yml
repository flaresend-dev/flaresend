name: Release client

# Publishes @flaresend/types and @flaresend/client to npm on its own.
# Runs on every push to main that changes either package. The version is
# worked out from conventional commits by scripts/release-client.mjs:
# fix/perf -> patch, feat -> minor, breaking -> major (minor on 0.x),
# anything else -> no release.
# Auth is npm trusted publishing (OIDC), so no npm token is stored here.

on:
  push:
    branches: [main]
    paths:
      - "packages/types/**"
      - "packages/client/**"
  workflow_dispatch:

concurrency:
  group: release-client
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit, tag and GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs full history and tags
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10.
      - run: npm install -g npm@latest

      - name: Work out next version
        id: next
        run: node scripts/release-client.mjs

      - if: steps.next.outputs.version != ''
        run: pnpm install --frozen-lockfile
      - if: steps.next.outputs.version != ''
        run: pnpm --filter @flaresend/types --filter @flaresend/client build
      - if: steps.next.outputs.version != ''
        run: pnpm --filter @flaresend/types --filter @flaresend/client typecheck
      - if: steps.next.outputs.version != ''
        run: pnpm --filter @flaresend/types --filter @flaresend/client test

      # The push uses GITHUB_TOKEN, so it does not trigger this or any other
      # workflow again.
      - name: Commit version and tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.next.outputs.bumped }}" = "true" ]; then
            git commit -am "chore(release): @flaresend/client v$VERSION"
            git tag "client-v$VERSION"
            git push --atomic origin HEAD:main "client-v$VERSION"
          elif ! git rev-parse -q --verify "refs/tags/client-v$VERSION" >/dev/null; then
            git tag "client-v$VERSION"
            git push origin "client-v$VERSION"
          fi

      # pnpm pack swaps "workspace:*" for the real version; npm publish then
      # uploads the tarball using the OIDC token. types goes first because
      # client depends on it.
      - name: Publish to npm
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          for pkg in types client; do
            name="@flaresend/$pkg"
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is already on npm, skipping"
              continue
            fi
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
            npm publish "$RUNNER_TEMP/pack/flaresend-$pkg-$VERSION.tgz" --access public
          done

      - name: Create GitHub release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if ! gh release view "client-v$VERSION" >/dev/null 2>&1; then
            gh release create "client-v$VERSION" --generate-notes --title "@flaresend/client $VERSION"
          fi
